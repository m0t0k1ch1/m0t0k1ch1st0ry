{{ define "title" }}
{{ .Title | title }} - {{ .Site.Title }}
{{ end }}

{{ define "main" }}
<section class="article-summaries-hero hero">
  <div class="hero-body">
    <div class="container has-text-centered">
      <div class="block">
        <h1 class="title">
          {{ .Title | title }}
        </h1>
      </div>
    </div>
  </div>
</section>
<section class="article-summaries section">
  <div class="container">
    <div class="tile is-ancestor">
      <div class="tile is-2 is-vertical">
      </div>
      <div class="tile is-8 is-vertical">
        <div class="block">
          {{ range .Data.Terms.ByCount }}
          <article class="tile box is-marginless is-shadowless">
            <div class="content">
              <h2 class="title is-size-4">
                <a href="{{ .Page.Permalink }}">
                  {{ partial "term-title.html" .Page }}
                </a>
              </h2>
              <span class="article-count is-size-6 has-text-grey-light">
                {{ .Count }} {{ if eq .Count 1 }}post{{ else }}posts{{ end }}
              </span>
            </div>
          </article>
          {{ end }}
        </div>
      </div>
      <div class="tile is-2 is-vertical">
      </div>
    </div>
  </div>
</section>
{{ end }}
