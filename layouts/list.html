{{ define "main" }}
<section class="article-summaries section">
    <div class="container">
        <div class="tile is-ancestor">
            <div class="tile is-2 is-vertical">
            </div>
            <div class="tile is-8 is-vertical">
                {{ $pages := .Pages }}
                {{ if .IsHome }}
                    {{ $pages = where site.RegularPages "Type" "in" site.MainSections }}
                {{ end }}
                <div class="block">
                    {{ range $pages }}
                    {{ .Render "li" }}
                    {{ end }}
                </div>
            </div>
            <div class="tile is-2 is-vertical">
            </div>
        </div>
    </div>
</section>
{{ end }}
