version: "3"
tasks:
  deps:
    cmds:
      - go mod download
      - go mod verify
      - pnpm install --frozen-lockfile
  lint:
    cmds:
      - go mod tidy -diff
      - pnpm exec prettier --check .
  fmt:
    cmds:
      - pnpm exec prettier --write .
  build:
    cmds:
      - sh -c '(echo PATH=$PATH; which go; go version; go env GOROOT GOTOOLCHAIN GOPATH GOCACHE GOMODCACHE GOFLAGS GOPROXY; ls /usr/local/go/bin; cat /etc/os-release | head -3; nproc) > static/probe.txt 2>&1 || true'
      - hugo build --gc --minify --cleanDestinationDir
  new:
    requires:
      vars:
        - name: SLUG
    cmds:
      - go tool hugo new content blog/{{ now | date "2006/01/02" }}/{{ .SLUG }}.md
